services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kite-trading-bot
    restart: unless-stopped

    # Environment variables (override defaults from Dockerfile)
    # On Coolify: set these in the Coolify UI environment variables section
    env_file:
      - ./config/.env

    environment:
      - DATABASE_URL=sqlite:////app/data/trades.db
      - LOG_FILE=/app/logs/trading_bot.log
      - LOG_LEVEL=INFO
      - TZ=Asia/Kolkata
      # Dashboard config
      - DASHBOARD_PORT=5000
      - DASHBOARD_HOST=0.0.0.0
      # Set a strong password hash (SHA-256 of your password)
      # Generate: python -c "import hashlib; print(hashlib.sha256(b'YOUR_PASSWORD').hexdigest())"
      # Default: admin123
      # - DASHBOARD_PASSWORD_HASH=your_sha256_hash_here
      # Skip market day check (useful for testing dashboard outside trading hours)
      # - SKIP_MARKET_DAY_CHECK=true

    # Persistent volumes
    volumes:
      # Trade database (SQLite) — survives container restarts
      - bot-data:/app/data
      # Log files — accessible from host
      - bot-logs:/app/logs
      # Config mount (bind mount your .env + overrides here)
      - ./config:/app/config:ro

    # Dashboard port — Coolify will reverse-proxy to this
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Health check via dashboard HTTP endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Stop gracefully (SIGTERM → square-off → shutdown)
    stop_grace_period: 60s
    stop_signal: SIGTERM

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for persistence
volumes:
  bot-data:
    driver: local
  bot-logs:
    driver: local
